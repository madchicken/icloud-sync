name: Build DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate icons
        run: python3 scripts/make_icon.py

      - name: Install Briefcase
        run: pip install briefcase

      - name: Create app
        run: briefcase create macOS app

      # rumps has no wheel on PyPI so Briefcase (--only-binary) can't install it.
      # Install it from source directly into the Briefcase Python after creation.
      - name: Install rumps into Briefcase environment
        run: |
          BFPY=$(find "macOS/app" -name "python3" -path "*/bin/python3" | head -1)
          echo "Briefcase Python: $BFPY"
          "$BFPY" -m pip install rumps

      - name: Build app
        run: briefcase build macOS app

      - name: Package DMG
        run: briefcase package macOS app --adhoc-sign

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(find dist -name "*.dmg" | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "DMG: $DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCloud-Sync-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 30

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg }}
