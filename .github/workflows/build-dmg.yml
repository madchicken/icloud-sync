name: Build DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate icons
        run: python3 scripts/make_icon.py

      - name: Build wheel
        run: |
          pip install build
          python3 -m build --wheel --outdir dist/

      # Compile a universal launcher binary (arm64 + x86_64) with no baked-in
      # paths — it discovers the bundled venv at runtime via _NSGetExecutablePath.
      # The install script on the user's machine copies this into the .app bundle.
      - name: Compile launcher
        run: |
          cc -arch arm64 -arch x86_64 -Wall -o dist/launcher scripts/launcher.c
          codesign --force --sign - dist/launcher

      - name: Assemble installer package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="dist/pkg"
          mkdir -p "$PKG"

          # Payload
          cp dist/virtualicloud-*.whl  "$PKG/"
          cp dist/launcher             "$PKG/"
          cp AppIcon.icns              "$PKG/"
          cp assets/menubarTemplate.png      "$PKG/"
          cp assets/menubarTemplate@2x.png   "$PKG/"
          echo "$VERSION"           > "$PKG/version.txt"

          # Install script
          cp scripts/install.command "$PKG/Install iCloud Sync.command"
          chmod +x "$PKG/Install iCloud Sync.command"

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="dist/iCloud-Sync-${VERSION}.dmg"
          TMPDIR_DMG="$(mktemp -d)"
          TMP_DMG="$TMPDIR_DMG/rw.dmg"
          MOUNT="$TMPDIR_DMG/mount"

          mkdir -p "$MOUNT"
          hdiutil create -srcfolder dist/pkg \
            -volname "iCloud Sync $VERSION" \
            -fs HFS+ -format UDRW -size 300m "$TMP_DMG"
          hdiutil attach -readwrite -noverify -noautoopen "$TMP_DMG" \
            -mountpoint "$MOUNT"
          hdiutil detach "$MOUNT"

          hdiutil convert "$TMP_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG"
          rm -rf "$TMPDIR_DMG"

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCloud-Sync-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 30

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg }}
