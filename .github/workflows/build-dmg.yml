name: Build DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate icons
        run: python3 scripts/make_icon.py

      - name: Install Briefcase
        run: pip install briefcase

      # rumps has no wheel on PyPI; Briefcase uses --only-binary :all: which would fail.
      # Patch pyproject.toml to remove rumps from [project].dependencies before create,
      # then install it from source into the Briefcase Python after creation.
      - name: Patch out rumps before briefcase create
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          t = p.read_text()
          t = re.sub(r'\s*"rumps>=0\.4",?\n', '\n', t)
          p.write_text(t)
          print("Patched pyproject.toml — rumps removed from [project].dependencies")
          EOF

      - name: Create app
        run: briefcase create macOS app

      # Briefcase uses app_packages/ for installed deps (no traditional Python binary).
      # Install rumps from source directly into the Briefcase app_packages directory.
      - name: Install rumps into Briefcase app_packages
        run: |
          TARGET=$(find build -type d -name "app_packages" | head -1)
          echo "app_packages: $TARGET"
          pip install --target "$TARGET" rumps

      - name: Build app
        run: briefcase build macOS app

      - name: Package DMG
        run: briefcase package macOS app --adhoc-sign

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(find dist -name "*.dmg" | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "DMG: $DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCloud-Sync-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 30

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg }}
