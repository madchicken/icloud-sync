name: Build DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # make_icon.py uses only macOS built-ins (sips, iconutil) — no pip deps needed.
      - name: Generate icons
        run: python3 scripts/make_icon.py

      # build_app.sh creates its own venv inside the bundle and pip-installs
      # the full package (including pyicloud from GitHub) into it.
      - name: Build .app bundle
        run: bash scripts/build_app.sh

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="dist/iCloud-Sync-${VERSION}.dmg"
          TMPDIR_DMG="$(mktemp -d)"
          STAGING="$TMPDIR_DMG/staging"
          TMP_DMG="$TMPDIR_DMG/rw.dmg"

          # Copy app into a staging folder
          mkdir -p "$STAGING"
          cp -r "dist/iCloud Sync.app" "$STAGING/"

          # Create a writable DMG from the staging folder
          hdiutil create -srcfolder "$STAGING" -volname "iCloud Sync $VERSION" \
            -fs HFS+ -fsargs "-c c=64,a=16,b=16" \
            -format UDRW -size 600m "$TMP_DMG"

          # Mount it at a known path and add the /Applications symlink inside
          MOUNT="$TMPDIR_DMG/mount"
          mkdir -p "$MOUNT"
          hdiutil attach -readwrite -noverify -noautoopen "$TMP_DMG" -mountpoint "$MOUNT"
          ln -s /Applications "$MOUNT/Applications"
          hdiutil detach "$MOUNT"

          # Convert to compressed read-only DMG
          hdiutil convert "$TMP_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG"
          rm -rf "$TMPDIR_DMG"

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCloud-Sync-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 30

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg }}
