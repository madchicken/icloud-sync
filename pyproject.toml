[project]
name = "virtualicloud"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    "pyicloud @ git+https://github.com/timlaing/pyicloud.git",
    "watchdog>=4.0",
    "keyring>=25.0",
]

[tool.setuptools.packages.find]
include = ["icloud_sync*"]

[project.scripts]
icloud-sync = "icloud_sync.cli:main"
